name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify GitHub Pages asset paths
        run: node -e "const fs=require('fs'), roots=[34,39,96].map(c=>String.fromCharCode(c)+'/assets/'); for(const f of fs.readdirSync('dist/assets').filter(f=>f.endsWith('.js'))) if(roots.some(p=>fs.readFileSync('dist/assets/'+f,'utf8').includes(p))) throw new Error('root asset path in '+f)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
